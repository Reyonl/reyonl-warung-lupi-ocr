  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; background: #07090d; color: #e4e7eb; }
  h1 { color: #63B3FF; margin-bottom: 4px; }
  .subtitle { color: #8a8a8a; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: #1a1c24; border: 1px solid #333; border-radius: 12px; padding: 16px; }
  .card h3 { margin: 0 0 8px 0; color: #63B3FF; font-size: 14px; }
  .image { max-width: 100%; border-radius: 8px; margin-bottom: 12px; }
  .ocr-text { font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.4; white-space: pre-wrap; background: #0d1117; padding: 12px; border-radius: 8px; border: 1px solid #333; max-height: 200px; overflow-y: auto; }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: #8a8a8a; margin-bottom: 4px; }
  input, textarea, select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #444; background: #0d1117; color: #e4e7eb; font-size: 13px; }
  button { background: #63B3FF; color: #000; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; }
  button:hover { background: #7dcfff; }
  .save-all { background: #0f0; color: #000; }
  table.items { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #333; font-size: 12px; }
  th { color: #63B3FF; }
  .add-item { margin-top: 8px; }
</style>
</head>

let gt = {};
DATA.forEach(d => { gt[d.image] = { date: '', customer: '', lines: [...d.lines], items: [] }; });

function render() {
  const app = document.getElementById('app');
  app.innerHTML = DATA.map(d => {
    const g = gt[d.image];
    const itemsHtml = g.items.map((it, i) => `
      <tr>
        <td><input type="text" placeholder="product name" value="${it.product||''}" onchange="gt['${d.image}'].items[${i}].product=this.value"></td>
        <td><input type="number" placeholder="qty" value="${it.qty||1}" onchange="gt['${d.image}'].items[${i}].qty=parseInt(this.value)||1"></td>
        <td><input type="number" placeholder="price" value="${it.unit_price||''}" onchange="gt['${d.image}'].items[${i}].unit_price=parseInt(this.value)||0"></td>
        <td><input type="checkbox" ${it.struck?'checked':''} onchange="gt['${d.image}'].items[${i}].struck=this.checked"></td>
        <td><button onclick="gt['${d.image}'].items.splice(${i},1);render()">Remove</button></td>
      </tr>
    `).join('');
    
    return `
    <div class="card">
      <h3>${d.image}</h3>
      <img src="file:///${d.image_path}" class="image" alt="${d.image}">
      <div class="form-group">
        <label>Date (YYYY-MM-DD)</label>
        <input type="date" value="${g.date}" onchange="gt['${d.image}'].date=this.value">
      </div>
      <div class="form-group">
        <label>Customer</label>
        <input type="text" placeholder="e.g. Bu Sri, Marco, Rama" value="${g.customer||''}" onchange="gt['${d.image}'].customer=this.value">
      </div>
      <div class="form-group">
        <label>OCR Lines (raw from Tesseract)</label>
        <div class="ocr-text">${g.lines.map(l => l || ' ').join('\n')}</div>
      </div>
      <table class="items">
        <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Struck</th><th>Action</th></tr></thead>
        <tbody>${itemsHtml}</tbody>
      </table>
      <div class="add-item">
        <button onclick="gt['${d.image}'].items.push({product:'',qty:1,unit_price:0,struck:false});render()">+ Add Item</button>
      </div>
    </div>
    `;
  }).join('');
  
  // Add save button
  app.innerHTML += `
  <div class="card" style="margin-top: 20px;">
    <button class="save-all" onclick="saveAll()">Save All Ground Truth as JSON</button>
  </div>
  `;
}

function saveAll() {
  const output = DATA.map(d => ({
    image: d.image,
    date: gt[d.image].date || null,
    customer: gt[d.image].customer || null,
    lines: gt[d.image].lines.filter(l => l.trim()),
    items: gt[d.image].items,
  }));
  
  const blob = new Blob([JSON.stringify(output, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'eval_ground_truth.json';
  a.click();
  alert('Saved as eval_ground_truth.json — paste ke terminal untuk import ke ground_truth/');
}

render();
